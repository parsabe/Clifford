[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clifford-assistant"
version = "0.1.0"
description = "Interface-independent personal assistant with explicit tool authorization"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "httpx>=0.28,<1",
  "vosk>=0.3.45,<0.4", "mcp>=1.9,<2", "jsonschema>=4.23,<5", "psycopg[binary]>=3.2,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[tool.setuptools.package-data]
clifford = ["prompts/*.md"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.setuptools.packages.find]
include = ["clifford*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
