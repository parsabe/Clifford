# Inside aaPanel's existing server { ... } block:
# - Set document root to the Laravel public/ directory.
# - Enable aaPanel Password Access at SERVER scope so every path, including voice, is protected.
#   Use aaPanel's generated auth_basic and auth_basic_user_file settings; keep credentials there.
# - Keep aaPanel's PHP-FPM and SSL includes.

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /clifford-voice {
    proxy_pass http://unix:/run/clifford/api.sock:/v1/voice/listen;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Add these INSIDE the site's EXISTING PHP/FastCGI location, not as HTTP request headers.
# Only set the protection marker after Password Access is active for the whole site.
# fastcgi_param CLIFFORD_SITE_PROTECTED 1;
# fastcgi_param REMOTE_USER $remote_user;
# fastcgi_buffering off;
# fastcgi_read_timeout 300s;
# fastcgi_send_timeout 300s;
# The PHP-FPM pool request_terminate_timeout should be at least 300 seconds.

location ~ /\.(?!well-known/) {
    deny all;
}
