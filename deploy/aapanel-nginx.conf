# Add these locations INSIDE the aaPanel site's existing server { ... } block.
# Keep aaPanel's PHP-FPM include and SSL certificate configuration.
# Document root: /www/wwwroot/clifford.parsabe.com/public

# Laravel rewrite rule; put this in aaPanel's URL Rewrite tab.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Voice-only WebSocket proxy. The kernel accepts a short-lived ticket in the first frame.
# This location does not proxy other kernel endpoints or accept a backend token in a URL.
location = /clifford-voice {
    proxy_pass http://127.0.0.1:8000/v1/voice/listen;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# PHP-FPM must have a request_terminate_timeout above 240 seconds for long chat replies.
# In the EXISTING PHP location/include (do not create a duplicate location), set:
# fastcgi_buffering off;
# fastcgi_read_timeout 300s;
# fastcgi_send_timeout 300s;
# Ensure aaPanel's deny rules block .env/.git and only public/ is exposed.

# Preserve access for ACME challenges while denying hidden configuration/source files.
location ~ /\.(?!well-known/) {
    deny all;
}
